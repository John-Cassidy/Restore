name: build and test

on:
  push:
  pull_request:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'

env:
  DOTNET_VERSION: '10.0.x' # The .NET SDK version to use

jobs:
  build-and-test:
    name: build-and-test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest] # [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Restore.sln

      - name: Build
        run: dotnet build Restore.sln --no-restore

      - name: Unit Tests
        run: >-
          dotnet test Restore.sln
          --no-build
          --verbosity normal
          --filter "Category!=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Integration Tests
        run: >-
          dotnet test Restore.sln
          --no-build
          --verbosity normal
          --filter "Category=Integration"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Merge Coverage Reports
        run: >-
          reportgenerator
          -reports:"**/TestResults/**/coverage.cobertura.xml"
          -targetdir:coveragereport
          -reporttypes:Cobertura
          -filefilters:"-**/obj/**"

      - name: Check Coverage Threshold
        run: |
          LINE_RATE=$(grep -oP 'line-rate="\K[^"]+' coveragereport/Cobertura.xml | head -1)
          PERCENT=$(echo "$LINE_RATE * 100" | bc -l | xargs printf "%.1f")
          echo "Line coverage: ${PERCENT}%"
          THRESHOLD=70
          if (( $(echo "$LINE_RATE < 0.${THRESHOLD}" | bc -l) )); then
            echo "::error::Coverage ${PERCENT}% is below the ${THRESHOLD}% threshold"
            exit 1
          fi
